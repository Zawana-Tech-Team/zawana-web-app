name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/zawana
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/zawana
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run validate:prisma:sqlite
        env:
          DATABASE_URL: file:./dev.db
      - run: pnpm run validate:prisma:postgres
      - run: pnpm --dir backend run prisma:generate:postgres
      - run: pnpm run typecheck
      - run: pnpm run build
