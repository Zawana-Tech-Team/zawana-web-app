name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/zawana
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/zawana

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            backend/pnpm-lock.yaml

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile --prod=false

      - name: Install backend dependencies
        run: pnpm --dir backend install --frozen-lockfile --prod=false

      - name: Verify Prisma CLI
        working-directory: backend
        run: pnpm exec prisma --version

      - name: Validate SQLite schema
        working-directory: backend
        run: pnpm exec prisma validate --schema prisma/schema.prisma
        env:
          DATABASE_URL: file:./dev.db

      - name: Validate PostgreSQL schema
        working-directory: backend
        run: pnpm exec prisma validate --schema prisma/postgresql/schema.prisma

      - name: Generate SQLite Prisma Client
        working-directory: backend
        run: pnpm run prisma:generate
        env:
          DATABASE_URL: file:./dev.db

      - name: Test Backend
        working-directory: backend
        run: pnpm test
        env:
          DATABASE_URL: file:./dev.db

      - name: Generate PostgreSQL Prisma Client
        working-directory: backend
        run: pnpm run prisma:generate:postgres

      - name: Typecheck Backend
        working-directory: backend
        run: pnpm exec tsc --noEmit

      - name: Build Backend
        working-directory: backend
        run: pnpm run build

      - name: Build Frontend
        run: pnpm run build

  postgres-courts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: zawana_court_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d zawana_court_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/zawana_court_test
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/zawana_court_test
      COURT_POSTGRES_TEST_URL: postgresql://ci:ci@127.0.0.1:5432/zawana_court_test
      AUTH_MODE: firebase
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend dependencies
        run: pnpm --dir backend install --frozen-lockfile --prod=false
      - name: Apply PostgreSQL migration history to disposable database
        run: pnpm --dir backend run prisma:migrate:postgres
      - name: Generate PostgreSQL Prisma Client
        run: pnpm --dir backend run prisma:generate:postgres
      - name: Test real PostgreSQL court API and concurrency
        run: pnpm --dir backend run test:court:postgres

  postgres-badminton:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: zawana_badminton_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d zawana_badminton_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/zawana_badminton_test
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/zawana_badminton_test
      BADMINTON_POSTGRES_TEST_URL: postgresql://ci:ci@127.0.0.1:5432/zawana_badminton_test
      BADMINTON_ONLY_POSTGRES: "1"
      AUTH_MODE: firebase
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend dependencies
        run: pnpm --dir backend install --frozen-lockfile --prod=false
      - name: Apply PostgreSQL migration history to disposable database
        run: pnpm --dir backend run prisma:migrate:postgres
      - name: Generate PostgreSQL Prisma Client
        run: pnpm --dir backend run prisma:generate:postgres
      - name: Test PostgreSQL category deductions, migration preservation and concurrency
        working-directory: backend
        run: pnpm exec tsx --test tests/badminton-category.test.ts
