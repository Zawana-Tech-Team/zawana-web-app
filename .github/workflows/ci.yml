name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/zawana
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/zawana

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate SQLite schema
        working-directory: backend
        run: pnpm exec prisma validate --schema prisma/schema.prisma
        env:
          DATABASE_URL: file:./dev.db

      - name: Validate PostgreSQL schema
        working-directory: backend
        run: pnpm exec prisma validate --schema prisma/postgresql/schema.prisma

      - name: Generate PostgreSQL Prisma Client
        working-directory: backend
        run: pnpm run prisma:generate:postgres

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build