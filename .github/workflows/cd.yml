name: Continuous Deployment (CD)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Zeus Cloud Server
    runs-on: ubuntu-latest

    steps:
      - name: Execute Deployment Commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e

            # Navigate to project root
            cd /var/www/zawana-app

            # Pull latest changes from GitHub
            git pull origin main

            # Setup system binary paths
            export PATH=$PATH:/usr/bin:/usr/local/bin

            # --- 1. Backend Build & Migration ---
            cd /var/www/zawana-app/backend
            pnpm install
            pnpm run prisma:generate:postgres
            pnpm run prisma:migrate:postgres
            pnpm run build

            # --- 2. Frontend Build ---
            cd /var/www/zawana-app
            pnpm install
            pnpm run build

            # --- 3. Restart PM2 Process ---
            pm2 restart zawana-backend --update-env

            echo "🚀 Deployment successfully completed!"
